<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rami en ligne</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Jeu de Rami</h1>
  <div id="hand">
    <button id="drawBtn">Piocher</button>
  </div>

  <!-- Main game area: discard pile, melds, and deck -->
  <div id="gameArea">
    <!-- Discard pile (left) - functional, click to draw from it -->
    <div id="discardPileContainer" class="pile-container">
      <h3>Défausse</h3>
      <div id="discardPile" class="pile" title="Cliquer pour piocher dans la défausse">
        <div class="pile-placeholder">Aucune carte</div>
      </div>
    </div>

    <!-- Melds area (center) -->
    <div id="melds" aria-label="Melds area">
      <div class="melds-inner">
        <p class="placeholder">Aucune combinaison pour le moment</p>
      </div>
    </div>

    <!-- Draw deck (right) - decorative -->
    <div id="deckContainer" class="pile-container">
      <h3>Pioche</h3>
      <div id="deck" class="pile deck-visual">
        <div class="card-back">🂠</div>
      </div>
    </div>
  </div>

  <!-- Toasts for errors / notifications -->
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
