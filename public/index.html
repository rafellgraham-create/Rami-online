<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rami en ligne</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Jeu de Rami</h1>
  
  <!-- Game controls -->
  <div id="gameControls" style="margin: 20px auto; text-align: center;">
    <div style="margin-bottom: 10px;">
      <button id="addBotEasyBtn" class="control-btn bot-btn">Ajouter Bot Facile</button>
      <button id="addBotMediumBtn" class="control-btn bot-btn">Ajouter Bot Moyen</button>
      <button id="addBotHardBtn" class="control-btn bot-btn">Ajouter Bot Difficile</button>
      <button id="addBotRealistBtn" class="control-btn bot-btn">Ajouter Bot Réaliste</button>
    </div>
    <div>
      <button id="startGameBtn" class="control-btn">Démarrer la partie</button>
      <button id="stopGameBtn" class="control-btn stop-btn" style="display: none;">Arrêter la partie</button>
    </div>
    <div id="turnIndicator" style="margin-top: 10px; font-size: 18px; color: #ffd966;"></div>
  </div>
  
  <div id="hand">
    <button id="drawBtn">Piocher</button>
  </div>
  <div id="handInfo" style="text-align:center;margin-top:4px;font-size:12px;color:#ffd966;">
    Cartes en main: <span id="handCount">0</span>
  </div>

  <!-- Main game area: discard pile, melds, and deck -->
  <div id="gameArea">
    <!-- Discard pile (left) - functional, click to draw from it -->
    <div id="discardPileContainer" class="pile-container">
      <h3>Défausse</h3>
      <div id="discardPile" class="pile" title="Cliquer pour piocher dans la défausse">
        <div class="pile-placeholder">Aucune carte</div>
      </div>
    </div>

    <!-- Melds area (center) -->
    <div id="melds" aria-label="Melds area">
      <div class="melds-inner">
        <p class="placeholder">Aucune combinaison pour le moment</p>
      </div>
    </div>

    <!-- Draw deck (right) - decorative -->
    <div id="deckContainer" class="pile-container">
      <h3>Pioche</h3>
      <div id="deck" class="pile deck-visual">
        <div class="card-back">🂠</div>
      </div>
    </div>
  </div>

  <!-- Toasts for errors / notifications -->
  <div id="toasts" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
